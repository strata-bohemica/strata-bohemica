name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'museum/**'
      - 'assets/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.5.1     # Godot 4.5.1 with the export templates
    steps:
      - uses: actions/checkout@v4
      - name: Import and export the museum (Web build, single-threaded, no special headers needed)
        run: |
          mkdir -p build/web
          godot --headless --import || true      # first import writes the .godot cache
          godot --headless --export-release "Web" build/web/index.html
          ls -la build/web
      - name: Assemble the site
        run: |
          mkdir -p public/museum
          cp -r site/. public/
          cp -r build/web/. public/museum/
          cp public/museum/index.html public/museum/museum.html || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
