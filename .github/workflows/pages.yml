name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'museum/**'
      - 'assets/**'
      - 'project.godot'
      - 'default_bus_layout.tres'
      - 'checks/web_audio/**'
      - 'export_presets.cfg'
      - '.github/workflows/pages.yml'
  pull_request:                  # build only (never deploys), so a change to the build is checked before it is merged
    paths:
      - 'site/**'
      - 'museum/**'
      - 'assets/**'
      - 'project.godot'
      - 'default_bus_layout.tres'
      - 'checks/web_audio/**'
      - 'export_presets.cfg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.5.1     # Godot 4.5.1 with the export templates
    steps:
      - uses: actions/checkout@v4
      - name: Put the export templates where Godot looks (GitHub sets HOME=/github/home inside containers)
        run: |
          V="${GODOT_VERSION:-4.5.1}"
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${V}.stable ~/.local/share/godot/export_templates/${V}.stable
      - name: Import and export the museum (Web build, single-threaded, no special headers needed)
        run: |
          mkdir -p build/web
          godot --headless --import || true      # first import writes the .godot cache and extracts the model textures
          godot --headless --import || true      # second pass: the scenes pick the textures up
          godot --headless --export-release "Web" build/web/index.html
          ls -la build/web
          du -h build/web/index.pck
      - uses: actions/upload-artifact@v4          # the raw export, for the audio output check below
        with:
          name: web-export
          path: build/web
          retention-days: 3
      - name: Assemble the site
        run: |
          mkdir -p public/diorama public/museum
          cp -r site/. public/diorama/          # the three.js diorama lives at /diorama/
          cp -r build/web/. public/             # the museum (Godot Web build) is the front page
          cp site/og.png site/favicon.svg public/
          # the old address keeps working
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../"><link rel="canonical" href="https://strata-bohemica.github.io/strata-bohemica/"><a href="../">Strata Bohemica</a>' > public/museum/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  web-audio:       # records what the web build sends to the audio output (checks/web_audio, museum/README.md); no sound card needed
    # REPORT-ONLY: `deploy` does not list this job in `needs` (SB-039 review 1, B1). Put `web-audio` back into `deploy.needs`
    # once the check has passed 10 consecutive runs in CI (on pull requests and main) with no failure and no retry used.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: actions/download-artifact@v4
        with:
          name: web-export
          path: web-export
      - name: Output check (Chromium, headless; one automatic retry, both results are printed)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm install --no-save playwright-core@1.49.1
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          echo "Node $(node --version); browser: $("$CHROMIUM_PATH" --version)"       # the runner's Chrome floats, so log it
          run_check() { node "$GITHUB_WORKSPACE/checks/web_audio/check_output.mjs" "$GITHUB_WORKSPACE/web-export"; }
          echo "::group::attempt 1"
          if run_check; then echo "::endgroup::"; echo "web-audio: PASS on attempt 1"; exit 0; fi
          echo "::endgroup::"
          echo "::warning::web-audio attempt 1 FAILED, retrying once"
          echo "::group::attempt 2"
          if run_check; then echo "::endgroup::"; echo "::warning::web-audio: attempt 1 FAILED, attempt 2 PASSED (count this as unstable)"; exit 0; fi
          echo "::endgroup::"
          echo "web-audio: FAILED on both attempts"
          exit 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build]        # not web-audio yet: see the comment on that job
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
