name: Checks

# The headless museum tests (checks/museum_village/run.sh) on every pull request and on main.
# pages.yml only builds and deploys the web export; it does not run these.
on:
  push:
    branches: [main]
    paths:
      - 'museum/**'
      - 'checks/**'
      - 'tools/**'
      - 'assets/**'
      - 'research/**'
      - 'project.godot'
      - '.github/workflows/checks.yml'
  pull_request:          # no paths filter: `museum-tests` is a required check, a skipped one blocks docs-only PRs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  museum-tests:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.5.1     # Godot 4.5.1, the version the project is pinned to
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install python3 (the sync_assets unit tests)
        run: apt-get update -qq && apt-get install -y -qq python3
      - name: Run the museum tests (sync_assets core epoch data terrain boundary view plough_team ui sound ambient camera object_view weather)
        shell: bash
        run: |
          godot --version
          start=$(date +%s)
          checks/museum_village/run.sh
          echo "tests took $(( $(date +%s) - start )) s"
