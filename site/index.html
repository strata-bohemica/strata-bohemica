<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Strata Bohemica: living diorama</title>
<link rel="canonical" href="https://strata-bohemica.github.io/strata-bohemica/">
<meta property="og:type" content="website">
<meta property="og:title" content="Strata Bohemica: living diorama">
<meta property="og:description" content="A digital open-air museum of Bohemian prehistory. A homestead built from the project's own models. All reconstructions are provisional.">
<meta property="og:image" content="https://strata-bohemica.github.io/strata-bohemica/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="A living diorama of a Bohemian prehistoric homestead, built from the project's own models. All reconstructions are provisional.">
<style>
  :root { --soil:#1E1914; --bone:#F3EBDD; --straw:#E6D5A8; --patina:#5E9C8A; --humus-l:#8A6B4B; }
  html,body { margin:0; height:100%; background:var(--soil); color:var(--bone); overflow:hidden;
    font-family:"IBM Plex Sans",system-ui,sans-serif; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  header { position:fixed; left:16px; top:14px; pointer-events:none; }
  header img { width:min(46vw,300px); height:auto; display:block; }
  .cap { position:fixed; left:16px; right:16px; bottom:12px; font:12px/1.4 "IBM Plex Mono",ui-monospace,monospace;
    color:var(--straw); opacity:.75; display:flex; justify-content:space-between; gap:12px; pointer-events:none; }
  .cap a, .cap button { color:inherit; pointer-events:auto; }
  .cap button { font:inherit; background:none; border:0; padding:0; text-decoration:underline; cursor:pointer; }
  #load { position:fixed; inset:0; display:grid; place-items:center; background:var(--soil);
    font:13px "IBM Plex Mono",ui-monospace,monospace; color:var(--straw); transition:opacity .8s; }
  #load.done { opacity:0; pointer-events:none; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
</head>
<body>
<header><img src="logo.svg" alt="Strata Bohemica"></header>
<div class="cap"><span>Render of the project's own models. All reconstructions are provisional.</span><span><a href="https://github.com/strata-bohemica/strata-bohemica">source on GitHub</a> · <button id="pause" type="button">pause animation</button> · drag to orbit</span></div>
<div id="load">loading models…</div>
<canvas id="c"></canvas>
<script type="module" src="main.js"></script>
</body>
</html>
